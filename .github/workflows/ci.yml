name: Project checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quick quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Types, lint, unit tests and metadata
        id: quality
        run: pnpm check
      - name: Build CSS
        id: css
        run: pnpm build:css
      - name: Publish summary
        if: always()
        env:
          QUALITY_RESULT: ${{ steps.quality.outcome }}
          CSS_RESULT: ${{ steps.css.outcome }}
        run: |
          mkdir -p reports/ci
          {
            echo '# Quick quality checks'
            echo
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Types, lint, unit tests, metadata | %s |\n' "$QUALITY_RESULT"
            printf '| CSS build | %s |\n\n' "$CSS_RESULT"
            echo 'Full browser acceptance and cross-browser suites run locally with pnpm check:local.'
            echo 'Use pnpm check:pr to publish their separate results to an open PR; this CI result does not certify browser coverage.'
          } > reports/ci/summary.md
          cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quick-quality-summary
          path: reports/ci/summary.md
          if-no-files-found: ignore
          retention-days: 7
