version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # typescript-eslint 8.73 supports TypeScript <6.1; revisit when its peer range expands.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
