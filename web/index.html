<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store Health · Settings</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">● Store Health</a>
      <nav>
        <a href="/reports/dashboard.html" target="_blank" rel="noopener">Reports ↗</a
        ><button id="reload" class="quiet">Reload settings</button>
      </nav>
    </header>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">CONTROL PANEL</p>
          <h1>Stores & schedules</h1>
          <p class="muted">Choose what to check and when. Changes apply after the current run.</p>
        </div>
        <button id="save" disabled>Save changes</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <section class="status-strip" aria-label="Scheduler status">
        <span id="worker">Connecting…</span><span id="active">No active check</span>
      </section>
      <div class="layout">
        <aside>
          <div class="list-heading">
            <h2>Stores</h2>
            <button id="add-store" class="quiet">+ Add</button>
          </div>
          <div id="store-list"></div>
          <button id="general" class="general quiet">Scheduling & pauses</button>
          <details class="import">
            <summary>Import existing configuration</summary>
            <p class="muted">Optional: choose your existing store and scheduler files.</p>
            <label
              >Store file<input
                id="import-sites"
                type="file"
                accept=".json,application/json" /></label
            ><label
              >Scheduler file<input
                id="import-scheduler"
                type="file"
                accept=".json,application/json" /></label
            ><button id="import" class="quiet">Load files into editor</button>
          </details>
        </aside>
        <section id="editor" class="panel" aria-label="Settings editor"></section>
      </div>
    </main>
    <template id="welcome"
      ><div class="welcome">
        <span class="welcome-icon">＋</span>
        <h2>Add your first store</h2>
        <p>
          Enter its address and two product handles, then choose a schedule.<br />Nothing runs until
          you save an enabled schedule.
        </p>
        <button id="welcome-add">Add a store</button>
      </div></template
    >
  </body>
</html>
